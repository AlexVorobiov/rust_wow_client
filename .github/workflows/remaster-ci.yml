name: remaster-ci

on:
  push:
    branches:
      - feat/m2-remaster-capture
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remaster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format branch
        if: github.event_name == 'push'
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style: apply rustfmt to remaster capture"
            git push origin HEAD:feat/m2-remaster-capture
          fi
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run focused remaster tests
        run: cargo test -p benilla-app m2studio --lib
      - name: Check benilla-app
        run: cargo check -p benilla-app
      - name: Build player seam
        run: cargo build -p benilla --no-default-features
