name: remaster-ci

on:
  push:
    branches:
      - feat/m2-remaster-capture

permissions:
  contents: read
  statuses: write

jobs:
  remaster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused remaster contract tests
        id: test
        shell: bash
        run: |
          set +e
          rustc --edition=2021 --test crates/benilla-app/tests/m2studio_red.rs -o /tmp/m2studio-red
          code=$?
          if [ "$code" = "0" ]; then
            /tmp/m2studio-red
            code=$?
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_CODE: ${{ steps.test.outputs.code }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TEST_CODE" = "0" ]; then
            state=success
            description="focused remaster tests passed"
          else
            state=failure
            description="focused remaster tests failed"
          fi
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="remaster-ci/focused" \
            -f description="$description" \
            -f target_url="$RUN_URL"
          exit "$TEST_CODE"
