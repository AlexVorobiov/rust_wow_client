name: apply-m2-3q

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/m2-remaster-capture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Add front three-quarter studio view
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('crates/benilla-app/src/dev/m2studio.rs')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '''enum StudioView {\n    Front,\n    Right,\n    Back,\n    Left,\n}''',
                  '''enum StudioView {\n    Front,\n    FrontThreeQuarter,\n    Right,\n    Back,\n    Left,\n}''',
              ),
              (
                  '    const ALL: [Self; 4] = [Self::Front, Self::Right, Self::Back, Self::Left];',
                  '''    const ALL: [Self; 5] = [\n        Self::Front,\n        Self::FrontThreeQuarter,\n        Self::Right,\n        Self::Back,\n        Self::Left,\n    ];''',
              ),
              (
                  '''            Self::Front => "front.png",\n            Self::Right => "right.png",''',
                  '''            Self::Front => "front.png",\n            Self::FrontThreeQuarter => "front_3q.png",\n            Self::Right => "right.png",''',
              ),
              (
                  '''            Self::Front => [0.0, 0.0, -1.0],\n            Self::Right => [-1.0, 0.0, 0.0],''',
                  '''            Self::Front => [0.0, 0.0, -1.0],\n            Self::FrontThreeQuarter => [\n                -std::f32::consts::FRAC_1_SQRT_2,\n                0.0,\n                -std::f32::consts::FRAC_1_SQRT_2,\n            ],\n            Self::Right => [-1.0, 0.0, 0.0],''',
              ),
              (
                  '        assert_eq!(names, ["front.png", "right.png", "back.png", "left.png"]);',
                  '        assert_eq!(names, ["front.png", "front_3q.png", "right.png", "back.png", "left.png"]);',
              ),
          ]

          if 'FrontThreeQuarter' not in s:
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'patch anchor not found: {old[:80]!r}')
                  s = s.replace(old, new, 1)

              assertion_anchor = '        assert_eq!(StudioView::Front.forward(), [0.0, 0.0, -1.0]);\n'
              assertion = '''        assert_eq!(\n            StudioView::FrontThreeQuarter.forward(),\n            [\n                -std::f32::consts::FRAC_1_SQRT_2,\n                0.0,\n                -std::f32::consts::FRAC_1_SQRT_2,\n            ]\n        );\n'''
              if assertion_anchor not in s:
                  raise SystemExit('three-quarter assertion anchor not found')
              s = s.replace(assertion_anchor, assertion_anchor + assertion, 1)

          s = s.replace('"Re-capture 4 Views"', '"Re-capture 5 Views"')
          s = s.replace('"Capture 4 Views"', '"Capture 5 Views"')
          s = s.replace(
              'fn completion_requires_success_and_all_four_images()',
              'fn completion_requires_success_and_all_five_images()',
          )
          p.write_text(s, encoding='utf-8')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and push
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo '3/4 capture already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/benilla-app/src/dev/m2studio.rs
          git commit -m 'feat: add front three-quarter M2 capture'
          git push origin HEAD:feat/m2-remaster-capture
